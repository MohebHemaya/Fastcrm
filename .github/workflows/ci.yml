name: CI

on:
  push:
    branches: [main, master, 'phase-*']
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (PHP 8.3 & MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: driver_system_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, zip, gd, fileinfo, openssl
          coverage: none

      - name: Install Composer dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint Code Style Check
        run: |
          cd backend
          php vendor/bin/pint --test

      - name: Run PHPStan / Larastan
        run: |
          cd backend
          php vendor/bin/phpstan analyse --memory-limit=512M

      - name: Check PHPStan Baseline Entries Count
        run: |
          php scripts/check-baseline-size.php

      - name: Check Artisan Documentation Commands
        run: |
          php scripts/check-artisan-docs.php

      - name: Run Pest Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: driver_system_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          cd backend
          php vendor/bin/pest

  frontend:
    name: Frontend (Node 20 & Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck
        run: |
          cd frontend
          npx tsc -b

      - name: Run Vitest Tests
        run: |
          cd frontend
          npm run test

      - name: Build Production Assets
        run: |
          cd frontend
          npm run build
